<button type="button"
        class="lsb-live"
        *ngIf="haPartiteInCorso"
        (click)="apriDialog()"
        [attr.aria-label]="'LIVE_SCORE.DIALOG_TITLE' | translate">
  <span class="lsb-dot"></span>
  <span class="lsb-label">{{ 'LIVE_SCORE.LIVE_BADGE' | translate }}</span>
  <span class="lsb-sep" aria-hidden="true">·</span>
  <span class="lsb-count">{{ 'LIVE_SCORE.MATCHES_COUNT' | translate: { count: partiteInCorsoCount } }}</span>
</button>
