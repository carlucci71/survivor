<div class="lsd-container">
  <div class="lsd-header">
    <span class="lsd-bubble lsd-b1"></span>
    <span class="lsd-bubble lsd-b2"></span>
    <span class="lsd-header-icon"><mat-icon>scoreboard</mat-icon></span>
    <div class="lsd-header-text">
      <span class="lsd-title">{{ 'LIVE_SCORE.DIALOG_TITLE' | translate }}</span>
      <span class="lsd-subtitle">
        {{ 'LIVE_SCORE.MATCHES_COUNT' | translate: { count: partiteAttive.length } }}
        <span class="lsd-live-chip" *ngIf="inCorsoCount > 0"><span class="lsd-live-dot lsd-live-dot--on-dark"></span>{{ inCorsoCount }} {{ 'LIVE_SCORE.LIVE_NOW' | translate }}</span>
      </span>
    </div>
    <button type="button" class="lsd-close-btn" (click)="onClose()" [attr.aria-label]="'COMMON.CLOSE' | translate">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- TAB CAMPIONATI - solo se l'utente ne segue più di uno -->
  <div class="lsd-tabs" *ngIf="mostraTab">
    <button type="button" class="lsd-tab" *ngFor="let gruppo of gruppi"
            [class.lsd-tab--active]="gruppo.id === tabAttivo"
            (click)="selezionaTab(gruppo.id)">
      {{ gruppo.labelKey | translate }}
    </button>
  </div>

  <div class="lsd-body">
    <div class="lsd-list" *ngIf="partiteAttive.length > 0; else vuoto">
      <button type="button" class="lsd-match-row" *ngFor="let partita of partiteAttive; let i = index"
              [class.lsd-match-row--live]="partita.stato === 'IN_CORSO'"
              [class.lsd-match-row--ft]="partita.stato === 'TERMINATA'"
              [class.lsd-match-row--no-detail]="!dettaglioDisponibile"
              [style.animation-delay.ms]="i * 30"
              (click)="apriDettaglio(partita)">

        <div class="lsd-team">
          <span class="lsd-logo-wrap"><img *ngIf="getLogo(partita.casaSigla) as logo" [src]="logo" [alt]="partita.casaNome" class="lsd-logo" (error)="$any($event.target).style.display='none'"></span>
          <span class="lsd-team-name">{{ partita.casaNome }}</span>
        </div>

        <div class="lsd-center">
          <span class="lsd-date" *ngIf="partita.orario">{{ partita.orario | date:'dd/MM' }}</span>
          <div class="lsd-score">
            <ng-container *ngIf="partita.stato !== 'DA_GIOCARE'; else orarioCalcioInizio">{{ partita.scoreCasa }} - {{ partita.scoreFuori }}</ng-container>
            <ng-template #orarioCalcioInizio>{{ partita.orario ? (partita.orario | date:'HH:mm') : '-' }}</ng-template>
          </div>
          <span class="lsd-status" [ngSwitch]="partita.stato">
            <span *ngSwitchCase="'IN_CORSO'" class="lsd-status-badge lsd-status-badge--live">
              <span class="lsd-live-dot"></span>
              <ng-container *ngIf="partita.intervallo; else minutoLive">{{ 'LIVE_SCORE.HALF_TIME' | translate }}</ng-container>
              <ng-template #minutoLive>{{ partita.minuto }}'</ng-template>
            </span>
            <span *ngSwitchCase="'TERMINATA'" class="lsd-status-badge lsd-status-badge--ft">{{ 'LIVE_SCORE.FULL_TIME' | translate }}</span>
            <span *ngSwitchDefault class="lsd-status-badge lsd-status-badge--upcoming">{{ 'LIVE_SCORE.UPCOMING' | translate }}</span>
          </span>
        </div>

        <div class="lsd-team lsd-team--away">
          <span class="lsd-team-name">{{ partita.fuoriNome }}</span>
          <span class="lsd-logo-wrap"><img *ngIf="getLogo(partita.fuoriSigla) as logo" [src]="logo" [alt]="partita.fuoriNome" class="lsd-logo" (error)="$any($event.target).style.display='none'"></span>
        </div>

        <mat-icon *ngIf="dettaglioDisponibile" class="lsd-chevron">chevron_right</mat-icon>
      </button>
    </div>

    <ng-template #vuoto>
      <div class="lsd-empty">
        <mat-icon>sports_soccer</mat-icon>
        <span>{{ 'LIVE_SCORE.NO_MATCHES' | translate }}</span>
      </div>
    </ng-template>
  </div>
</div>
